# Stack de produção (VPS). Execute a partir da raiz do repositório:
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file infra/docker/.env up -d --build
# Com CD, a imagem vem pronta do GHCR (ver docs/deploy.md):
#   docker compose ... pull api migrate && docker compose ... up -d --wait
#
# TLS, domínio e proxy reverso ficam no Nginx da máquina (ver docs/deploy.md).
# Este compose só entrega a API em 127.0.0.1:${API_PORT:-3000}.
name: kora

x-api: &api
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile
  # Publicada pelo workflow Deploy. `IMAGE_TAG=<sha do commit>` faz rollback.
  image: ghcr.io/koratcc/kora-api:${IMAGE_TAG:-latest}
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  networks: [backend]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    # Só em 127.0.0.1: acesso de ferramentas (DBeaver) apenas por túnel SSH.
    # Nunca publique sem o 127.0.0.1: o Docker ignora o UFW.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    # Uma rede `internal` não permite publicar portas, por isso a `host`.
    networks: [backend, host]

  # Roda as migrations pendentes e termina. A API só sobe se ele terminar com sucesso.
  migrate:
    <<: *api
    restart: 'no'
    command:
      [
        'node_modules/.bin/typeorm',
        '-d',
        'dist/database/data-source.js',
        'migration:run',
      ]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Só o Nginx da própria máquina alcança a API. Nunca publique sem o
    # 127.0.0.1: o Docker ignora o UFW e a porta ficaria aberta na internet.
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    # Uma rede `internal` não permite publicar portas, por isso a `host`.
    networks: [backend, host]

networks:
  # Postgres fica só aqui: sem saída para fora e sem porta publicada.
  backend:
    internal: true
  host:

volumes:
  pgdata:
