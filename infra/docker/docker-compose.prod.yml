# Stack de produção (VPS). Execute a partir da raiz do repositório:
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file infra/docker/.env up -d --build
name: kora

x-api: &api
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile
  image: kora-api:${IMAGE_TAG:-latest}
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  networks: [backend]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    # Sem `ports`: o banco só é acessível pela rede interna.
    networks: [backend]

  # Roda as migrations pendentes e termina. A API só sobe se ele terminar com sucesso.
  migrate:
    <<: *api
    restart: 'no'
    command:
      [
        'node_modules/.bin/typeorm',
        '-d',
        'dist/database/data-source.js',
        'migration:run',
      ]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend, edge]

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ../nginx/templates:/etc/nginx/templates:ro
      # Desativa o site padrão da imagem, que também escuta na porta 80.
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]

  # Emissão/renovação de certificados (ver docs/deploy.md). Não sobe por padrão.
  certbot:
    image: certbot/certbot:v4.2.0
    profiles: [certbot]
    volumes:
      - ./certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

networks:
  backend:
    internal: true
  edge:

volumes:
  pgdata:
  certbot-webroot:
