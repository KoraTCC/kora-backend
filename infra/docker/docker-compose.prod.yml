# Stack de produção (VPS). Execute a partir da raiz do repositório:
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file infra/docker/.env up -d --build
# Com CD, a imagem vem pronta do GHCR (ver docs/deploy.md):
#   docker compose ... pull api migrate && docker compose ... up -d --wait
#
# TLS, domínio e proxy reverso ficam no Nginx da máquina (ver docs/deploy.md).
# Este compose só entrega a API em 127.0.0.1:${API_PORT:-3000}.
name: kora

x-api: &api
  build:
    context: ../..
    dockerfile: Dockerfile
    args:
      APP: api
  # Publicada pelo workflow Deploy. `IMAGE_TAG=<sha do commit>` faz rollback.
  image: ghcr.io/koratcc/kora-api:${IMAGE_TAG:-latest}
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  networks: [backend]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    # Só em 127.0.0.1: acesso de ferramentas (DBeaver) apenas por túnel SSH.
    # Nunca publique sem o 127.0.0.1: o Docker ignora o UFW.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    # Uma rede `internal` não permite publicar portas, por isso a `host`.
    networks: [backend, host]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:3000/health > /dev/null || exit 1',
        ]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Trabalho em segundo plano (fila de jobs, expiração de cobranças).
  # Sem porta: ninguém faz requisição para ele.
  worker:
    <<: *api
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APP: worker
    image: ghcr.io/koratcc/kora-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # `backend`: o banco. `host`: saída para a internet (SMTP, webhooks).
    networks: [backend, host]
    # Sem HTTP: o worker atualiza um arquivo a cada ciclo; mais de 60 s sem
    # atualizar = travado.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "process.exit(Date.now() - require('fs').statSync('/tmp/worker-heartbeat').mtimeMs < 60000 ? 0 : 1)"
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3

  # Roda as migrations pendentes e termina. A API só sobe se ele terminar com sucesso.
  migrate:
    <<: *api
    restart: 'no'
    command:
      [
        'node_modules/.bin/typeorm',
        '-d',
        'dist/database/data-source.js',
        'migration:run',
      ]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Só o Nginx da própria máquina alcança a API. Nunca publique sem o
    # 127.0.0.1: o Docker ignora o UFW e a porta ficaria aberta na internet.
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    # Uma rede `internal` não permite publicar portas, por isso a `host`.
    networks: [backend, host]

networks:
  # Postgres fica só aqui: sem saída para fora e sem porta publicada.
  backend:
    internal: true
  host:

volumes:
  pgdata:
